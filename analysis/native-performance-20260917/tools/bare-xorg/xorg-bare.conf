# Bare X server for the AZ presentation experiment: the DSI panel's own KMS
# device (drm-rp1-dsi, card1 on this Pi 5), modesetting with acceleration OFF
# (software shadow framebuffer, no glamor, no V3D), no secondary GPUs, libinput
# for the Ilitek touchscreen. Used with: Xorg :1 -config <this> -ac -nolisten tcp
Section "ServerFlags"
    Option "AutoAddGPU" "off"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Device"
    Identifier "dsi"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
    Option "AccelMethod" "none"
    Option "ShadowFB" "true"
EndSection
Section "Screen"
    Identifier "panel"
    Device "dsi"
    SubSection "Display"
        Modes "1280x800"
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "bare"
    Screen "panel"
EndSection
